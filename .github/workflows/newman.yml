name: Run Newman tests

# The suite runs against a ViewFlare started inside this runner, not against a
# deployed one. Two reasons, in order of how much they matter:
#
#   1. Every request in the collection is a contract test. None of them read
#      production data, and all of them pass against an empty database, so
#      pointing at a real deployment buys nothing and costs a dependency on the
#      network and on whatever bot protection the zone happens to have on. A
#      GitHub runner sending PostmanRuntime from an Azure IP looks exactly like
#      a bot, and Cloudflare's Bot Fight Mode answers it with a challenge page,
#      which lands in the tests as `Unexpected token '<' at 1:1`.
#   2. A fork gets a green run with no setup: no repository secrets, no
#      deployed instance, no account.
#
# What this does not check is the deployment itself: bindings, environment
# variables, routes. That needs a separate post-deploy check.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    newman:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run newman collection tests
              env:
                  WRANGLER_SEND_METRICS: "false"
              run: |
                  set -euo pipefail

                  # The collection asserts that the right password returns 200 and
                  # a wrong one returns 401, so both sides have to agree on a
                  # value. This one is generated per run and never leaves the
                  # runner, so there is no secret to configure.
                  admin_password="ci-$(openssl rand -hex 16)"
                  printf 'ADMIN_PASSWORD=%s\n' "${admin_password}" > .dev.vars

                  npm run build:worker

                  npx wrangler pages dev public --compatibility-date=2025-11-05 --port 8788 &
                  server=$!
                  trap 'kill "${server}" 2>/dev/null || true' EXIT

                  # /health needs no auth and no database, so it answers as soon
                  # as the worker is actually serving.
                  for _ in $(seq 1 60); do
                    curl -fsS -o /dev/null http://127.0.0.1:8788/health && break
                    sleep 1
                  done
                  curl -fsS -o /dev/null http://127.0.0.1:8788/health

                  npm run test:newman:ci -- \
                    --env-var "base_url=http://127.0.0.1:8788" \
                    --env-var "admin_password=${admin_password}"
