# ViewFlare runs as a Cloudflare Worker with static assets.
# The entry point 'public/_worker.js' is auto-generated via 'npm run build:worker'.

# Renamed from "cflaircounter" when the project moved off Cloudflare Pages.
# Pages had no rename operation, so the old name was kept to avoid targeting an
# empty project. Workers is a different product and this is a new Worker, so the
# name matches the product for the first time. The public surface is unchanged:
# counter.vkrishna04.me is attached as a custom domain in the dashboard.
name = "viewflare"

# Under Pages this file was consumed by the Pages build. Under Workers it is the
# script itself, and 'assets' below serves everything next to it.
main = "./public/_worker.js"

# Newest date the pinned toolchain supports (wrangler 4.46.0 bundles workerd
# 1.20251105.0). A later date makes `wrangler dev` fail with
# "Compatibility date ... is in the future and unsupported". Bump wrangler first,
# then this, then package.json's `dev` script, which passes it on the CLI.
compatibility_date = "2025-11-05"

# Static files. The `binding` is what makes `env.ASSETS.fetch(request)` work in
# functions/index.ts, which is how every non-/api/ path is served.
# `.assetsignore` sits in public/ and holds `_worker.js`, without which the
# bundled worker source would be published and readable at /_worker.js.
[assets]
directory = "./public"
binding = "ASSETS"

# Non-secret configuration. These were [env.production.vars] under Pages, where
# "production" named a git branch. Under Workers an [env.X] block declares a
# separate Worker named viewflare-X, so they belong at the top level instead.
# ADMIN_PASSWORD is deliberately absent: it is a secret, set once per deployment
# with `npx wrangler secret put ADMIN_PASSWORD`, never written to this file.
[vars]
ENABLE_ADMIN = "true"
ENABLE_ANALYTICS = "false"  # Disable heavy analytics to save queries
MAX_PROJECTS = "100"        # Limit projects to control usage

# Dev server configuration
[dev]
ip = "127.0.0.1"
port = 8788
local_protocol = "http"

# Nightly install-count snapshot, formerly .github/workflows/snapshot.yml.
# Running it here means it never crosses the edge, so it is unaffected by Bot
# Fight Mode and needs no admin password. UTC. `wrangler deploy` replaces the
# deployed trigger list, so removing this line removes the schedule.
[triggers]
crons = ["23 2 * * *"]

# Bindings for D1, R2, KV, etc.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#bindings
# D1 has no rename operation, so "viewflare-db" is a new database that the
# contents of "cflaircounter-db" were exported into. The binding is `DB`, which
# is the name the code reads and which never changed.
# Forking this repo? `npm run setup` creates your own database and rewrites the
# database_id below. Do not reuse the one here; it is an account-scoped
# identifier for someone else's data, not a secret and not useful to you.
[[d1_databases]]
binding = "DB"
database_name = "viewflare-db"
database_id = "41b376ca-8f65-4be9-8443-f7060b60b6ce"
