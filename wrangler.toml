# This project uses Cloudflare Pages Advanced Mode with a bundled worker.
# The entry point 'public/_worker.js' is auto-generated via 'npm run build:worker'.

# The Cloudflare Pages project stays "cflaircounter" on purpose. Pages has no
# rename operation (`wrangler pages project` offers only list/create/delete), so
# changing this does not rename anything -- it targets a *different* project, and
# the next deploy would build an empty one. The project name is never seen by a
# user: the public surface is counter.vkrishna04.me. ViewFlare is the product
# name, and it does not need to be the infrastructure name.
name = "cflaircounter"
main = "_worker.js"
# Newest date the pinned toolchain supports (wrangler 4.46.0 bundles workerd
# 1.20251105.0). A later date makes `wrangler pages dev` fail with
# "Compatibility date ... is in the future and unsupported". Bump wrangler first,
# then this, then package.json's `dev` script, which passes it on the CLI.
compatibility_date = "2025-11-05"

# Environment variables for production
[env.production.vars]
ADMIN_PASSWORD = "your-secure-admin-password-here"
ENABLE_ADMIN = "true"
ENABLE_ANALYTICS = "false"  # Disable heavy analytics to save queries
MAX_PROJECTS = "100"        # Limit projects to control usage

# Environment variables for development
[env.development.vars]
ADMIN_PASSWORD = ""
ENABLE_ADMIN = "true"
ENABLE_ANALYTICS = "true"
MAX_PROJECTS = "1000"

# Dev server configuration
[dev]
ip = "127.0.0.1"
port = 8788
local_protocol = "http"

# Bindings for D1, R2, KV, etc.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#bindings
# NOTE: `database_name` below is deliberately still "cflaircounter-db".
# D1 has no rename operation, and this is the name of the live database that
# already holds every recorded view count. Renaming it here would point wrangler
# at a database that does not exist. The *binding* is `DB` (that is what the code
# reads) and it is unaffected by the project rename. See docs/CLOUDFLARE-SETUP.md
# "Migrating the Pages project from cflaircounter to viewflare".
# A fresh deployment may use any database name; put it here.
[[d1_databases]]
binding = "DB"
database_name = "cflaircounter-db"
database_id = "" # This will be filled in after you create the DB
preview_database_id = "cflaircounter-db-preview"

# Pages configuration
[pages]
# The "main" branch will be used for production deployments
branch = "main"
# The directory containing your static assets (required for Pages)
pages_build_output_dir = "public"
# The directory containing your Functions
functions = "functions"
# The pattern of Functions to include
functions-pattern = "[[path]].ts"
# The pattern of Functions to exclude
# functions-exclude = "excluded-function.ts"
